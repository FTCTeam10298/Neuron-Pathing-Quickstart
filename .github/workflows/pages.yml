name: Deploy GitHub Pages

# Publishes just the static site (landing page, docs, planner tool) -- not the
# Android project -- to GitHub Pages. Enable it once in this repo's Settings ->
# Pages -> Source -> "GitHub Actions", then every push to main/master that
# touches one of the paths below redeploys automatically.

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r docs _site/docs
          cp -r tools _site/tools
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
